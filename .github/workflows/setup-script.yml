name: Windows setup script

on:
  push:
    branches: [main]
    paths: ["setup/**", ".github/workflows/setup-script.yml"]
  pull_request:
    paths: ["setup/**", ".github/workflows/setup-script.yml"]
  schedule:
    - cron: "41 5 * * 1" # every Monday: catch winget packages that were renamed or removed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Parse, analyze and dry run (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup\windows\setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'No parse errors.'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path setup/windows/setup.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if ($results) { exit 1 }
          Write-Host 'No analyzer findings.'

      # Windows PowerShell 5.1 turns redirected stderr into errors, which the
      # script's ErrorActionPreference = 'Stop' would make fatal. Prove the
      # helpers survive a failing native command with stderr output.
      - name: Native command helpers under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup\windows\setup.ps1", [ref]$null, [ref]$null)
          $wanted = 'Invoke-NativeQuiet', 'Get-GitConfig'
          $defs = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $wanted -contains $n.Name }, $true)
          if (@($defs).Count -ne 2) { throw 'helper functions not found in setup.ps1' }
          foreach ($d in $defs) { . ([scriptblock]::Create($d.Extent.Text)) }

          $out = Invoke-NativeQuiet git --version
          if ($LASTEXITCODE -ne 0 -or ($out -join ' ') -notmatch 'git version') { throw "git --version: $out" }

          $out = Invoke-NativeQuiet git -C "$env:TEMP\no-such-folder" status
          if ($LASTEXITCODE -eq 0) { throw 'expected a non-zero exit code' }
          Write-Host "stderr captured without throwing: $out"

          if ($null -ne (Get-GitConfig 'no.such.key')) { throw 'missing key should return $null' }
          git config --global user.name 'CI Bot'
          if ((Get-GitConfig 'user.name') -ne 'CI Bot') { throw 'Get-GitConfig did not read user.name' }
          Write-Host 'Helpers OK'

      - name: Dry run with Windows PowerShell 5.1
        shell: powershell
        run: .\setup\windows\setup.ps1 -DryRun -GitName "CI" -GitEmail "ci@example.com"

      - name: Dry run with PowerShell 7 and skipped groups
        shell: pwsh
        run: ./setup/windows/setup.ps1 -DryRun -Skip Engines, Art, PowerPlan

  winget-ids:
    name: Package IDs exist in the winget catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check every Id against microsoft/winget-pkgs
        run: |
          git clone --quiet --filter=tree:0 --no-checkout --depth 1 https://github.com/microsoft/winget-pkgs /tmp/winget-pkgs
          missing=0
          for id in $(grep -oP "Id\s*=\s*'\K[^']+" setup/windows/setup.ps1); do
            first=$(echo "${id:0:1}" | tr 'A-Z' 'a-z')
            path="manifests/$first/$(echo "$id" | tr '.' '/')"
            if git -C /tmp/winget-pkgs ls-tree -d --name-only HEAD "$path/" | grep -q .; then
              echo "ok       $id"
            else
              echo "MISSING  $id"
              missing=1
            fi
          done
          exit $missing
